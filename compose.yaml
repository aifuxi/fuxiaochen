services:
  app:
    image: ${APP_IMAGE:-ghcr.io/aifuxi/fuxiaochen:latest}
    restart: unless-stopped
    init: true
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?请填写最终 HTTPS 站点 origin}
      DATABASE_URL: ${DATABASE_URL:?请配置 postgres:5432 的生产连接 URL}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      BACKUP_DIRECTORY: /app/data/backups
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_REGION: ${OSS_REGION:-cn-hangzhou}
      OSS_SERVER_ENDPOINT: ${OSS_SERVER_ENDPOINT:-https://s3.oss-cn-hangzhou.aliyuncs.com}
      OSS_SERVER_ENDPOINT_MODE: ${OSS_SERVER_ENDPOINT_MODE:-service}
      OSS_UPLOAD_ENDPOINT: ${OSS_UPLOAD_ENDPOINT:-https://s3.oss-cn-hangzhou.aliyuncs.com}
      OSS_UPLOAD_ENDPOINT_MODE: ${OSS_UPLOAD_ENDPOINT_MODE:-service}
      OSS_PUBLIC_ORIGIN: ${OSS_PUBLIC_ORIGIN:-}
      OSS_CREDENTIAL_MODE: ${OSS_CREDENTIAL_MODE:-environment}
      OSS_RAM_ROLE_NAME: ${OSS_RAM_ROLE_NAME:-}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${ALIBABA_CLOUD_SECURITY_TOKEN:-}
      ANALYTICS_CLIENT_IP_HEADER: ${ANALYTICS_CLIENT_IP_HEADER:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      database:
      caddy:
        aliases:
          - fuxiaochen
    volumes:
      - app-data:/app/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?请配置生产数据库管理密码}
      POSTGRES_APP_USER: fuxiaochen
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?请配置生产应用数据库密码}
      POSTGRES_APP_DB: fuxiaochen
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-fuxiaochen-postgres}
  app-data:
    name: ${APP_DATA_VOLUME:-fuxiaochen-data}

networks:
  database:
    internal: true
  caddy:
    external: true
    name: ${CADDY_NETWORK:-infra_edge}
